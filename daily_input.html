<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日次入力 | 医療アプリ</title>

  <!-- 共通CSS（鈴木作成） -->
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ========================================
       積山担当：日次入力画面専用スタイル
       クラス名プレフィックス「t-」統一
    ======================================== */
    .t-body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .t-header {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .t-header-left { display: flex; align-items: center; gap: 10px; }
    .t-header-icon {
      width: 36px; height: 36px;
      background: #2563eb;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .t-header-title { font-size: 16px; font-weight: 700; color: #1e293b; }
    .t-header-date  { font-size: 12px; color: #64748b; margin-top: 1px; }
    .t-btn-logout {
      background: #f1f5f9; border: none; border-radius: 8px;
      padding: 7px 14px; font-size: 13px; color: #475569;
      cursor: pointer; font-weight: 600;
    }
    .t-btn-logout:hover { background: #e2e8f0; }
    .t-card {
      width: 100%; max-width: 430px;
      background: #fff;
      border-radius: 16px;
      padding: 24px 20px;
      margin: 16px 0 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
    }
    .t-error-banner {
      display: none;
      background: #fff7ed;
      border: 1px solid #fb923c;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #c2410c;
      gap: 8px;
    }
    .t-error-banner.t-show { display: flex; align-items: flex-start; }
    .t-section { margin-bottom: 22px; }
    .t-section-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 700; color: #1e293b;
      margin-bottom: 10px;
    }
    .t-btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .t-btn-choice {
      flex: 1; min-width: 72px;
      padding: 10px 8px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 14px; font-weight: 600; color: #475569;
      cursor: pointer; text-align: center;
      transition: all .15s;
    }
    .t-btn-choice:hover { border-color: #93c5fd; background: #eff6ff; }
    .t-btn-choice.t-selected { border-color: #2563eb; background: #2563eb; color: #fff; }
    .t-btn-choice.t-err-field { border-color: #ef4444 !important; }
    .t-mood-group { display: flex; gap: 6px; justify-content: space-between; }
    .t-btn-mood {
      flex: 1;
      padding: 10px 4px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
      cursor: pointer;
      text-align: center;
      transition: all .15s;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .t-btn-mood .t-emoji { font-size: 22px; }
    .t-btn-mood .t-score { font-size: 11px; color: #94a3b8; font-weight: 600; }
    .t-btn-mood:hover { border-color: #93c5fd; background: #eff6ff; }
    .t-btn-mood.t-selected { border-color: #2563eb; background: #eff6ff; }
    .t-btn-mood.t-err-field { border-color: #ef4444 !important; }
    .t-purpose-block {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .t-purpose-label { font-size: 13px; color: #64748b; margin-bottom: 8px; }
    .t-purpose-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .t-btn-purpose {
      padding: 9px 6px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      font-size: 13px; color: #475569; font-weight: 600;
      cursor: pointer; text-align: center;
      transition: all .15s;
    }
    .t-btn-purpose:hover { border-color: #93c5fd; background: #eff6ff; }
    .t-btn-purpose.t-selected { border-color: #2563eb; background: #2563eb; color: #fff; }
    .t-btn-purpose.t-err-field { border-color: #ef4444 !important; }
    .t-time-row { display: flex; gap: 12px; }
    .t-time-block { flex: 1; }
    .t-time-block label { font-size: 12px; color: #64748b; margin-bottom: 5px; display: block; }
    .t-time-input {
      width: 100%; padding: 10px 12px;
      border: 2px solid #e2e8f0; border-radius: 10px;
      font-size: 15px; color: #1e293b; background: #f8fafc;
      outline: none; transition: border-color .15s;
    }
    .t-time-input:focus { border-color: #2563eb; background: #fff; }
    .t-time-input.t-err-field { border-color: #ef4444 !important; }
    .t-field-error {
      display: none; font-size: 12px; color: #ef4444;
      margin-top: 4px; font-weight: 600;
    }
    .t-field-error.t-show { display: block; }
    .t-btn-submit {
      width: 100%; padding: 15px;
      background: #2563eb; border: none; border-radius: 12px;
      color: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      transition: background .15s;
    }
    .t-btn-submit:hover  { background: #1d4ed8; }
    .t-btn-submit:active { background: #1e40af; }
    .t-footer { font-size: 11px; color: #94a3b8; padding: 12px 0 24px; text-align: center; }
    .t-modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: center; justify-content: center;
    }
    .t-modal-overlay.t-show { display: flex; }
    .t-modal {
      background: #fff; border-radius: 20px;
      padding: 32px 24px;
      width: 90%; max-width: 380px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }
    .t-modal-icon  { font-size: 52px; margin-bottom: 12px; }
    .t-modal-title { font-size: 20px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
    .t-modal-sub   { font-size: 14px; color: #64748b; margin-bottom: 16px; }
    .t-modal-msg {
      border-radius: 10px; padding: 14px 16px;
      font-size: 14px; font-weight: 600;
      margin-bottom: 20px; line-height: 1.5;
    }
    .t-modal-msg.t-good { background: #f0fdf4; color: #166534; }
    .t-modal-msg.t-bad  { background: #fff7ed; color: #9a3412; }
    .t-btn-hospital {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 13px;
      background: #f97316; border: none; border-radius: 12px;
      color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-bottom: 10px;
    }
    .t-btn-hospital:hover { background: #ea580c; }
    .t-btn-home {
      width: 100%; padding: 13px;
      background: #2563eb; border: none; border-radius: 12px;
      color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    .t-btn-home:hover { background: #1d4ed8; }
  </style>
</head>

<body class="t-body">

<!-- ヘッダー -->
<header class="t-header">
  <div class="t-header-left">
    <div class="t-header-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
                 M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
    </div>
    <div>
      <div class="t-header-title">日次入力</div>
      <div class="t-header-date" id="t-today-date"></div>
    </div>
  </div>
  <button class="t-btn-logout" onclick="tHandleLogout()">ログアウト</button>
</header>

<main>
  <div class="t-card">

    <!-- エラーバナー -->
    <div class="t-error-banner" id="t-error-banner">
      <span>⚠️</span>
      <div id="t-error-banner-text"></div>
    </div>

    <!-- 気分（5段階） -->
    <div class="t-section">
      <div class="t-section-label">😊 今日の気分</div>
      <div class="t-mood-group" id="t-mood-group">
        <button class="t-btn-mood" data-val="1" onclick="tSelectMood(1)">
          <span class="t-emoji">😢</span><span class="t-score">1</span>
        </button>
        <button class="t-btn-mood" data-val="2" onclick="tSelectMood(2)">
          <span class="t-emoji">😟</span><span class="t-score">2</span>
        </button>
        <button class="t-btn-mood" data-val="3" onclick="tSelectMood(3)">
          <span class="t-emoji">😐</span><span class="t-score">3</span>
        </button>
        <button class="t-btn-mood" data-val="4" onclick="tSelectMood(4)">
          <span class="t-emoji">🙂</span><span class="t-score">4</span>
        </button>
        <button class="t-btn-mood" data-val="5" onclick="tSelectMood(5)">
          <span class="t-emoji">😄</span><span class="t-score">5</span>
        </button>
      </div>
      <div class="t-field-error" id="t-err-mood">気分を選択してください</div>
    </div>

    <!-- 体調 -->
    <div class="t-section">
      <div class="t-section-label">🩺 体調</div>
      <div class="t-btn-group" id="t-condition-group">
        <button class="t-btn-choice" data-val="good"   onclick="tSelectCondition('good')">良い</button>
        <button class="t-btn-choice" data-val="normal" onclick="tSelectCondition('normal')">普通</button>
        <button class="t-btn-choice" data-val="bad"    onclick="tSelectCondition('bad')">悪い</button>
      </div>
      <div class="t-field-error" id="t-err-condition">体調を選択してください</div>
    </div>

    <!-- 外出 -->
    <div class="t-section">
      <div class="t-section-label">🚶 外出</div>
      <div class="t-btn-group" id="t-outing-group">
        <button class="t-btn-choice" data-val="yes" onclick="tSelectOuting('yes')">した</button>
        <button class="t-btn-choice" data-val="no"  onclick="tSelectOuting('no')">していない</button>
      </div>
      <div class="t-field-error" id="t-err-outing">外出を選択してください</div>

      <div class="t-purpose-block" id="t-purpose-block">
        <div class="t-purpose-label">外出目的</div>
        <div class="t-purpose-grid" id="t-purpose-group">
          <button class="t-btn-purpose" data-val="hospital" onclick="tSelectPurpose('hospital')">通院</button>
          <button class="t-btn-purpose" data-val="shopping" onclick="tSelectPurpose('shopping')">買い物</button>
          <button class="t-btn-purpose" data-val="walk"     onclick="tSelectPurpose('walk')">散歩・運動</button>
          <button class="t-btn-purpose" data-val="work"     onclick="tSelectPurpose('work')">仕事</button>
          <button class="t-btn-purpose" data-val="social"   onclick="tSelectPurpose('social')">友人・家族との交流</button>
          <button class="t-btn-purpose" data-val="other"    onclick="tSelectPurpose('other')">その他</button>
        </div>
        <div class="t-field-error" id="t-err-purpose">外出目的を選択してください</div>
      </div>
    </div>

    <!-- 睡眠の質 -->
    <div class="t-section">
      <div class="t-section-label">🌙 睡眠の質</div>
      <div class="t-btn-group" id="t-sleep-group">
        <button class="t-btn-choice" data-val="deep"    onclick="tSelectSleep('deep')">深い</button>
        <button class="t-btn-choice" data-val="shallow" onclick="tSelectSleep('shallow')">浅い</button>
      </div>
      <div class="t-field-error" id="t-err-sleep">睡眠の質を選択してください</div>
    </div>

    <!-- 就寝・起床時間 -->
    <div class="t-section">
      <div class="t-section-label">🕐 就寝・起床時間</div>
      <div class="t-time-row">
        <div class="t-time-block">
          <label for="t-sleep-time">就寝時間</label>
          <input type="time" id="t-sleep-time" class="t-time-input" />
        </div>
        <div class="t-time-block">
          <label for="t-wake-time">起床時間</label>
          <input type="time" id="t-wake-time" class="t-time-input" />
        </div>
      </div>
      <div class="t-field-error" id="t-err-time">起床時間は就寝時間より後に設定してください</div>
    </div>

    <button class="t-btn-submit" onclick="tHandleSubmit()">記録する</button>

  </div>
  <footer class="t-footer">© 2025 医療アプリ. All rights reserved.</footer>
</main>


<!-- =============================================
     モーダル（別ファイルにせずここに記述）
     通常は display:none → JSで表示切替
============================================= -->

<!-- 登録完了（良い・普通） -->
<div class="t-modal-overlay" id="t-modal-good">
  <div class="t-modal">
    <div class="t-modal-icon">✅</div>
    <div class="t-modal-title">記録完了</div>
    <div class="t-modal-sub">本日の入力が完了しました。<br>お疲れ様でした！</div>
    <div class="t-modal-msg t-good">体調は良好です！<br>この調子で健康管理を続けましょう。</div>
    <button class="t-btn-home" onclick="tGoHome()">ホームへ</button>
  </div>
</div>

<!-- 登録完了（悪い） -->
<div class="t-modal-overlay" id="t-modal-bad">
  <div class="t-modal">
    <div class="t-modal-icon">⚠️</div>
    <div class="t-modal-title">記録完了</div>
    <div class="t-modal-sub">本日の入力が完了しました。</div>
    <div class="t-modal-msg t-bad">
      体調があまり良くないようです。<br>
      無理をせず、医療機関への相談をご検討ください。
    </div>
    <!-- 病院アクセスページへ：中間さん担当の home.html（予約アクセス機能）へ遷移 -->
    <button class="t-btn-hospital" onclick="tOpenHospital()">
      🏥 病院の予約アクセスページを開く
    </button>
    <button class="t-btn-home" onclick="tGoHome()">ホームへ</button>
  </div>
</div>


<!-- 共通JS（鈴木作成） -->
<script src="js/app.js"></script>

<script>
  /* ==========================================
     ログインチェック（WBS必須）
     app.js の checkAuth() を呼び出す
  ========================================== */
  const currentUserId = checkAuth();
  if (currentUserId) {
    console.log("ログイン確認OK:", currentUserId);
  }

  /* ==========================================
     状態管理
  ========================================== */
  const tState = {
    mood:      null,
    condition: null,
    outing:    null,
    purpose:   null,
    sleep:     null,
  };

  /* 今日の日付を表示 */
  (function tSetDate() {
    const d = new Date();
    document.getElementById('t-today-date').textContent =
      d.toLocaleDateString('ja-JP', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
      });
  })();

  /* 現在時刻をデフォルト値にセット */
  (function tSetDefaultTime() {
    const now  = new Date();
    const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    document.getElementById('t-sleep-time').value = hhmm;
    document.getElementById('t-wake-time').value  = hhmm;
  })();

  /* ==========================================
     選択ヘルパー
  ========================================== */
  function tSelectGroup(groupId, val, btnClass) {
    document.querySelectorAll(`#${groupId} .${btnClass}`).forEach(b => {
      b.classList.toggle('t-selected', b.dataset.val === val);
      b.classList.remove('t-err-field');
    });
  }
  function tSelectMood(val) {
    tState.mood = val;
    document.querySelectorAll('#t-mood-group .t-btn-mood').forEach(b => {
      b.classList.toggle('t-selected', Number(b.dataset.val) === val);
      b.classList.remove('t-err-field');
    });
    tHideErr('t-err-mood');
  }
  function tSelectCondition(val) {
    tState.condition = val;
    tSelectGroup('t-condition-group', val, 't-btn-choice');
    tHideErr('t-err-condition');
  }
  function tSelectOuting(val) {
    tState.outing = val;
    tSelectGroup('t-outing-group', val, 't-btn-choice');
    tHideErr('t-err-outing');
    document.getElementById('t-purpose-block').style.display = val === 'yes' ? 'block' : 'none';
    if (val === 'no') {
      tState.purpose = null;
      document.querySelectorAll('#t-purpose-group .t-btn-purpose')
        .forEach(b => b.classList.remove('t-selected'));
    }
  }
  function tSelectPurpose(val) {
    tState.purpose = val;
    tSelectGroup('t-purpose-group', val, 't-btn-purpose');
    tHideErr('t-err-purpose');
  }
  function tSelectSleep(val) {
    tState.sleep = val;
    tSelectGroup('t-sleep-group', val, 't-btn-choice');
    tHideErr('t-err-sleep');
  }

  /* ==========================================
     エラー表示ヘルパー
  ========================================== */
  function tShowErr(id) { document.getElementById(id).classList.add('t-show'); }
  function tHideErr(id) { document.getElementById(id).classList.remove('t-show'); }
  function tMarkErrGroup(groupId, btnClass) {
    document.querySelectorAll(`#${groupId} .${btnClass}`)
      .forEach(b => b.classList.add('t-err-field'));
  }

  /* ==========================================
     バリデーション
  ========================================== */
  function tValidate() {
    let ok = true;
    const missing = [];

    if (!tState.mood) {
      tMarkErrGroup('t-mood-group', 't-btn-mood');
      tShowErr('t-err-mood');
      missing.push('今日の気分'); ok = false;
    }
    if (!tState.condition) {
      tMarkErrGroup('t-condition-group', 't-btn-choice');
      tShowErr('t-err-condition');
      missing.push('体調'); ok = false;
    }
    if (!tState.outing) {
      tMarkErrGroup('t-outing-group', 't-btn-choice');
      tShowErr('t-err-outing');
      missing.push('外出'); ok = false;
    }
    if (tState.outing === 'yes' && !tState.purpose) {
      tMarkErrGroup('t-purpose-group', 't-btn-purpose');
      tShowErr('t-err-purpose');
      missing.push('外出目的'); ok = false;
    }
    if (!tState.sleep) {
      tMarkErrGroup('t-sleep-group', 't-btn-choice');
      tShowErr('t-err-sleep');
      missing.push('睡眠の質'); ok = false;
    }

    const sleepTime = document.getElementById('t-sleep-time').value;
    const wakeTime  = document.getElementById('t-wake-time').value;
    if (!sleepTime || !wakeTime) {
      document.getElementById('t-sleep-time').classList.add('t-err-field');
      document.getElementById('t-wake-time').classList.add('t-err-field');
      document.getElementById('t-err-time').textContent = '就寝・起床時間を入力してください';
      tShowErr('t-err-time');
      missing.push('就寝・起床時間'); ok = false;
    } else if (wakeTime <= sleepTime) {
      document.getElementById('t-wake-time').classList.add('t-err-field');
      document.getElementById('t-err-time').textContent =
        '起床時間は就寝時間より後に設定してください';
      tShowErr('t-err-time');
      missing.push('就寝・起床時間'); ok = false;
    } else {
      document.getElementById('t-sleep-time').classList.remove('t-err-field');
      document.getElementById('t-wake-time').classList.remove('t-err-field');
      tHideErr('t-err-time');
    }

    const banner = document.getElementById('t-error-banner');
    if (!ok) {
      document.getElementById('t-error-banner-text').textContent =
        `未入力項目（残り${missing.length}件）：${missing.join('、')}`;
      banner.classList.add('t-show');
      banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      banner.classList.remove('t-show');
    }
    return ok;
  }

  /* ==========================================
     送信処理（モック）
  ========================================== */
  function tHandleSubmit() {
    if (!tValidate()) return;

    // モック：API連携時はここを fetch('/api/daily-record', ...) に差し替える
    const record = {
      userId:    currentUserId,
      date:      new Date().toISOString().slice(0, 10),
      mood:      tState.mood,
      condition: tState.condition,
      outing:    tState.outing,
      purpose:   tState.purpose,
      sleep:     tState.sleep,
      sleepTime: document.getElementById('t-sleep-time').value,
      wakeTime:  document.getElementById('t-wake-time').value,
    };
    console.log('[日次記録 モック INSERT]:', record);

    // 体調判定：「悪い」→ 病院案内モーダル、それ以外 → 完了モーダル
    if (tState.condition === 'bad') {
      document.getElementById('t-modal-bad').classList.add('t-show');
    } else {
      document.getElementById('t-modal-good').classList.add('t-show');
    }
  }

  /* 病院アクセスページへ遷移（中間さん担当の home.html へ） */
  function tOpenHospital() {
    window.location.href = 'home.html';
  }

  /* ホームへ遷移 */
  function tGoHome() {
    document.getElementById('t-modal-good').classList.remove('t-show');
    document.getElementById('t-modal-bad').classList.remove('t-show');
    window.location.href = 'home.html';
  }

  /* ログアウト（app.js の共通関数） */
  function tHandleLogout() {
    if (confirm('ログアウトしますか？')) {
      logout();
    }
  }

  /* Enterキーで記録ボタン発火 */
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
      tHandleSubmit();
    }
  });
</script>

</body>
</html>
