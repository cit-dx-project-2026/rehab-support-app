<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リハビリ支援アプリ - 管理者用データ解析ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">リハビリ支援システム</h1>
                <p class="text-sm text-indigo-200 mt-1">管理者用データ解析ダッシュボード（実DB自動同期版）</p>
            </div>
            <div id="connection-badge" class="bg-indigo-800 px-3 py-1.5 rounded-full text-xs font-semibold text-indigo-200 border border-indigo-700">
                DB接続確認中...
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 space-y-8">

        <div class="grid grid-cols-1 gap-5 sm:grid-cols-3">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm font-medium text-gray-500 truncate">分析データ総数</p>
                <p id="summary-count" class="mt-2 text-3xl font-semibold text-gray-900">-- 件</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm font-medium text-gray-500 truncate">平均 気分スコア</p>
                <p id="summary-avg-mood" class="mt-2 text-3xl font-semibold text-indigo-600">-- / 5.0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 ring-2 ring-indigo-500">
                <p class="text-sm font-medium text-gray-500 truncate">モデル寄与率 (決定係数 R²)</p>
                <p id="summary-r2" class="mt-2 text-3xl font-semibold text-emerald-600">0.000</p>
                <p class="text-xs text-gray-400 mt-1">睡眠時間だけでどれくらい「気分」を説明できているかの指標です</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h3 class="text-lg font-semibold text-gray-900 mb-2">睡眠時間と気分の相関分析</h3>
            <p class="text-xs text-gray-500 mb-4">実際のDBデータから算出した相関関係と、統計的な傾向線（回帰直線）を表示しています。</p>
            <div class="h-80 relative">
                <canvas id="correlationChart"></canvas>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-6 border-b border-gray-200 bg-gray-50">
                <h3 class="text-lg font-semibold text-gray-900">rehab_app.db 同期データ履歴</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">日付</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">就寝時間</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">起床時間</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">睡眠時間 (算出)</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-indigo-600 font-bold uppercase">今日の気分 (目的変数: 1-5)</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body" class="bg-white divide-y divide-gray-200 text-sm">
                        <tr>
                            <td colspan="5" class="px-6 py-8 text-center text-gray-400">DBからデータを読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let activeData = [];
        let chart = null;

        // 1. 画面起動時に自動で「rehab_app.db」を読み込む関数
        async function loadDatabaseAutomated() {
            const badge = document.getElementById('connection-badge');
            try {
                // 同じフォルダにある rehab_app.db を自動で取得
                const response = await fetch('rehab_app.db');
                if (!response.ok) throw new Error('rehab_app.db が見つからないか、ローカルサーバー経由で開かれていません。');
                
                const buffer = await response.arrayBuffer();
                const Uints = new Uint8Array(buffer);
                
                // sql.jsの初期化
                const config = { locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/${filename}` };
                const SQL = await initSqlJs(config);
                const db = new SQL.Database(Uints);

                // 【★DB構造に合わせてここを修正】
                // テーブル名：user_logs、カラム名：date, sleep_start, sleep_end, mood_score と仮定
                const tableName = "user_logs"; 
                const query = `SELECT date, sleep_start, sleep_end, mood_score FROM ${tableName} ORDER BY date DESC`;
                
                const res = db.exec(query);

                if (res.length === 0) {
                    badge.className = "bg-amber-100 text-amber-800 px-3 py-1.5 rounded-full text-xs font-bold border border-amber-300";
                    badge.textContent = "データ空";
                    alert("DBは開けましたが、テーブル内にデータがありません。");
                    return;
                }

                // データを配列に格納
                const rows = res[0].values;
                activeData = rows.map(row => ({
                    date: row[0],
                    start: row[1],
                    end: row[2],
                    sleepHours: calculateSleepHours(row[1], row[2]),
                    mood: parseInt(row[3], 10)
                }));

                // 接続バッジを「同期中」に更新
                badge.className = "bg-emerald-100 text-emerald-800 px-3 py-1.5 rounded-full text-xs font-bold border border-emerald-300 flex items-center gap-1.5";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> rehab_app.db 同期済`;

                // 解析と描画の実行
                updateDashboard();

            } catch (error) {
                console.error(error);
                badge.className = "bg-red-100 text-red-800 px-3 py-1.5 rounded-full text-xs font-bold border border-red-300";
                badge.textContent = "DB接続エラー";
                
                const tbody = document.getElementById('data-table-body');
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-500 font-medium">【エラー】DBの自動読み込みに失敗しました。<br><span class="text-xs text-gray-400">原因: ${error.message}</span></td></tr>`;
            }
        }

        function calculateSleepHours(start, end) {
            if (!start || !end) return 0;
            const [sHour, sMin] = start.split(':').map(Number);
            const [eHour, eMin] = end.split(':').map(Number);
            let startMin = sHour * 60 + sMin;
            let endMin = eHour * 60 + eMin;
            if (endMin <= startMin) endMin += 24 * 60;
            return parseFloat(((endMin - startMin) / 60).toFixed(1));
        }

        function calculateRegression(data) {
            if (data.length < 2) return { intercept: 0, slope: 0, r2: 0 };
            const X = data.map(d => [1, d.sleepHours]);
            const Y = data.map(d => [d.mood]);
            try {
                const Xt = math.transpose(X);
                const XtX = math.multiply(Xt, X);
                const XtX_inv = math.inv(XtX);
                const XtY = math.multiply(Xt, Y);
                const B = math.multiply(XtX_inv, XtY);
                const intercept = B[0][0];
                const slope = B[1][0];
                const yValues = Y.map(r => r[0]);
                const yMean = math.mean(yValues);
                let ssTot = 0, ssRes = 0;
                for (let i = 0; i < data.length; i++) {
                    const yActual = yValues[i];
                    const yPred = intercept + slope * data[i].sleepHours;
                    ssTot += Math.pow(yActual - yMean, 2);
                    ssRes += Math.pow(yActual - yPred, 2);
                }
                const r2 = ssTot === 0 ? 0 : 1 - (ssRes / ssTot);
                return { intercept, slope, r2: Math.max(0, Math.min(1, r2)) };
            } catch (error) {
                return { intercept: 0, slope: 0, r2: 0 };
            }
        }

        function updateChart(data, regression) {
            const ctx = document.getElementById('correlationChart').getContext('2d');
            const scatterData = data.map(d => ({ x: d.sleepHours, y: d.mood }));
            const xHours = data.map(d => d.sleepHours);
            const minX = Math.min(...xHours) - 0.5;
            const maxX = Math.max(...xHours) + 0.5;
            const lineData = [
                { x: minX, y: regression.intercept + regression.slope * minX },
                { x: maxX, y: regression.intercept + regression.slope * maxX }
            ];

            if (chart) {
                chart.data.datasets[0].data = scatterData;
                chart.data.datasets[1].data = lineData;
                chart.update();
            } else {
                chart = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [
                            { label: '実際のデータ（睡眠 vs 気分）', data: scatterData, backgroundColor: 'rgba(79, 70, 229, 0.7)', pointRadius: 6 },
                            { label: '傾向線', data: lineData, type: 'line', borderColor: 'rgba(220, 38, 38, 0.8)', borderWidth: 2, fill: false, pointRadius: 0 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { title: { display: true, text: '睡眠時間 (時間)' } },
                            y: { title: { display: true, text: '気分スコア (1-5)' }, min: 0, max: 6, ticks: { stepSize: 1 } }
                        }
                    }
                });
            }
        }

        function updateDashboard() {
            const count = activeData.length;
            const avgMood = count > 0 ? (activeData.reduce((sum, d) => sum + d.mood, 0) / count).toFixed(1) : '0.0';
            const regression = calculateRegression(activeData);
            
            document.getElementById('summary-count').textContent = `${count} 件`;
            document.getElementById('summary-avg-mood').textContent = `${avgMood} / 5.0`;
            document.getElementById('summary-r2').textContent = regression.r2.toFixed(3);
            
            updateChart(activeData, regression);
            
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = '';
            activeData.forEach(d => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">${d.date}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">${d.start}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">${d.end}</td>
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${d.sleepHours} 時間</td>
                    <td class="px-6 py-4 whitespace-nowrap font-bold text-indigo-600 text-center bg-indigo-50/20">${d.mood}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 起動時に自動実行
        window.onload = function() {
            loadDatabaseAutomated();
        };
    </script>
</body>
</html>
